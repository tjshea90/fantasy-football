<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>League Tracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="hrow">
    <h1 id="title">Live</h1>
    <div class="wk">
      <button id="wkPrev" class="chip" aria-label="previous week">&#8249;</button>
      <span id="wkLabel">Wk 1</span>
      <button id="wkNext" class="chip" aria-label="next week">&#8250;</button>
    </div>
  </div>
  <div id="syncbar" class="syncbar"><span id="syncText">not synced</span>
    <button id="syncBtn" class="btn sm">Sync week</button></div>
  <div id="job" class="job" hidden><div class="jt" id="jobText"></div>
    <div class="bar"><i id="jobBar" style="width:0%"></i></div></div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-v="live"      class="tab on"><span class="dot">&#9679;</span>Live</button>
  <button data-v="lineups"   class="tab"><span class="dot">&#9776;</span>Lineups</button>
  <button data-v="rosters"   class="tab"><span class="dot">&#128101;</span>Roster</button>
  <button data-v="advice"    class="tab"><span class="dot">&#9733;</span>Advice</button>
  <button data-v="data"      class="tab"><span class="dot">&#9881;</span>Data</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script>
/* The Java shell calls this with the real system-bar insets in CSS px. It may
   fire before or after the page scripts load, so it only touches CSS vars and
   remembers the values for the Display panel. */
/* The async HTTP bridge lands here. Java starts a request on a pool thread and
   calls __httpDone(id) when the body is ready; espn.js parks a resolver under
   that id. This MUST be defined before any module loads, because a callback
   that arrives with no handler is a request lost forever. It lives in the page
   rather than in a module for the same reason __setInsets does: Java can fire
   it before or after the scripts have run. */
window.__httpPending = {};
window.__httpDone = function (id) {
  var cb = window.__httpPending[id];
  if (cb) { try { cb(); } catch (e) { /* the resolver reports its own errors */ } }
};
window.__insets = {t:0,r:0,b:0,l:0,seen:false};
window.__setInsets = function (t, r, b, l) {
  window.__insets = {t:t, r:r, b:b, l:l, seen:true};
  var s = document.documentElement.style;
  s.setProperty('--ins-top', t + 'px');
  s.setProperty('--ins-r',   r + 'px');
  s.setProperty('--ins-bot', b + 'px');
  s.setProperty('--ins-l',   l + 'px');
};
window.__setAdjust = function (top, bot) {
  var s = document.documentElement.style;
  s.setProperty('--adj-top', (top || 0) + 'px');
  s.setProperty('--adj-bot', (bot || 0) + 'px');
};
/* The message goes into element TEXT, never markup. It used to be concatenated
   straight into innerHTML — and an error message is not trusted input here:
   NativeBridge puts up to 400 characters of an HTTP error BODY into it, so a
   crafted response could inject script into the one page that holds the Native
   bridge. Built with DOM nodes instead, which cannot be escaped wrong. */
window.onerror = function (m, src, line, col, err) {
  var v = document.getElementById('view');
  if (!v) return false;
  v.innerHTML = '';
  var card = document.createElement('div'); card.className = 'card';
  var h = document.createElement('h2'); h.textContent = 'Script error';
  var pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-size:12px;color:#f85149';
  pre.textContent = String(m) + '\n' + String(src).split('/').pop() +
    ':' + line + ':' + col + (err && err.stack ? '\n\n' + err.stack : '');
  card.appendChild(h); card.appendChild(pre); v.appendChild(card);
  return false;
};
</script>
<script src="version.js"></script>
<script src="seed.js"></script>
<script src="players.js"></script>
<script src="scoring.js"></script>
<script src="espn.js"></script>
<script src="names.js"></script>
<script src="store.js"></script>
<script src="playerdb.js"></script>
<script src="projections.js"></script>
<script src="usage.js"></script>
<script src="ai.js"></script>
<script src="recommend.js"></script>
<script src="sim.js"></script>
<script src="value.js"></script>
<script src="recap.js"></script>
<!-- schedule.js needs Store and Espn; Recommend only at call time -->
<script src="schedule.js"></script>
<!-- handoff.js needs Ai, Recommend and Value to already be defined -->
<script src="handoff.js"></script>
<!-- gestures.js is standalone: ui.js hands it callbacks, it reads nothing -->
<script src="gestures.js"></script>
<script src="ui.js"></script>
</body>
</html>
