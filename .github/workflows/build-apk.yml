name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: sdk
          key: android-sdk-${{ hashFiles('build.sh') }}

      - name: Build APK
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFTracker-${{ github.sha }}
          path: build/app-release.apk
