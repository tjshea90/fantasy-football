name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Independent of any Claude session. A handoff between accounts is
      # exactly when a regression slips through, because the account that
      # picks the work up did not watch the account before it run these.
      # Reported, not gated: a red suite must not block the APK, since a
      # mid-task checkpoint is often legitimately red and still worth having.
      - name: Test suites
        continue-on-error: true
        run: |
          for t in tools/test_*.js tools/check_es2018.js; do
            [ -f "$t" ] || continue
            if node "$t" >/dev/null 2>&1; then echo "  OK    $(basename "$t")"
            else echo "  FAIL  $(basename "$t")"; fi
          done

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: sdk
          key: android-sdk-${{ hashFiles('build.sh') }}

      - name: Build APK
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFTracker-${{ github.sha }}
          path: build/app-release.apk
